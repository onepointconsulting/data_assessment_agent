<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@500&family=Sen:wght@400;700&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400;1,500&family=Lato&family=Montserrat:wght@500&family=Sen:wght@400;700&display=swap"
        rel="stylesheet" />
    <style>
        body {
            font-family: "Lato", sans-serif;
            margin: 1em -0.1em 1em -0.1em;
            font-size: 1.2rem;
        }

        h2 {
            color: #a6a6a6;
            margin-top: 1.5em;
            font-weight: 400;
            font-size: 2rem;
        }

        h2.questionnaire,
        h2.personalOffer {
            margin-bottom: 0;
        }

        p {
            line-height: 1.5em;
        }

        .container {
            margin: 0em auto;
            box-sizing: border-box;
            max-width: 1320px;
            padding: 0 1rem;
        }

        .image-banner {
            height: 13em;
            width: 100%;
            display: flex;
            flex-direction: "row";
            align-items: center;
            margin: -11.5em 0 1em 0;
            padding: 0 1em;
            box-sizing: border-box;
        }

        .banner {
            width: 100%;
        }

        .webiste-link:link,
        .webiste-link:visited {
            color: #0084d7;
        }

        .webiste-link:hover,
        .webiste-link:active {
            color: #66b5e7;
        }

        .email-link:link,
        .email-link:visited {
            color: #0084d7;
        }

        .email-link:hover,
        .email-link:active {
            color: #66b5e7;
        }

        .image-banner h1,
        .image-banner h3 {
            color: white;
        }

        .date-produced {
            font-size: small;
            text-align: left;
        }

        .onepoint-blue {
            color: #0084d7;
        }

        .onepoint-answer {
            padding-top: 0.6em;
            padding-bottom: 1.5em;
        }

        ul li {
            margin-bottom: 1.5em;
            line-height: 1.5em;
        }

        .logo {
            margin: 0 0 1em 0;
        }

        .image {
            width: 100%;
        }

        .charts {
            /* margin: 0 2rem; */
            margin: 0 auto;
        }

        @media screen and (max-width: 764px) {
            h2 {
                font-size: 1.5rem;
            }

            p {
                font-size: 1rem;
            }
        }

        .total-row p {
            font-size: 1.5rem;
            margin-top: 0px;
        }

        h3 {
            padding-top: 0.5rem;
            padding-bottom: 1rem;
            color: #a6a6a6;
            margin-bottom: 0;
            font-weight: 400;
            font-size: 1.75rem;
        }
    </style>
</head>
